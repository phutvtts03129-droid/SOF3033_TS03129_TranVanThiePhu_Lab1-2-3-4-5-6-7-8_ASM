<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Cầm Tay Modern Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .display-font {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Hiệu ứng bấm nút mượt mà */
        .btn-act {
            transition: all 0.15s ease;
            user-select: none;
        }
        .btn-act:active {
            transform: scale(0.93);
            filter: brightness(1.2);
        }
        .btn-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Card chứa máy tính -->
    <div class="w-full max-w-sm bg-slate-900/90 backdrop-blur-md rounded-3xl p-6 border border-slate-700/50 shadow-2xl">
        
        <!-- Tiêu đề / Header -->
        <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">ELECTRONIC CALCULATOR</span>
            <div class="flex space-x-1.5">
                <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                <div class="w-3 h-3 rounded-full bg-amber-500/80"></div>
                <div class="w-3 h-3 rounded-full bg-emerald-500/80"></div>
            </div>
        </div>

        <!-- Màn hình hiển thị -->
        <div class="bg-slate-950/80 rounded-2xl p-5 mb-6 border border-slate-800 text-right shadow-inner flex flex-col justify-between min-h-[110px]">
            <!-- Chuỗi phép tính lịch sử -->
            <div id="historyDisplay" class="display-font text-slate-400 text-sm font-medium tracking-wide min-h-[20px] overflow-x-auto whitespace-nowrap scrollbar-none">
                <!-- Ví dụ: 125 + 45 -->
            </div>
            <!-- Kết quả / Con số hiện tại -->
            <div id="currentDisplay" class="display-font text-3xl sm:text-4xl font-bold text-white tracking-wider overflow-x-auto whitespace-nowrap scrollbar-none">
                0
            </div>
        </div>

        <!-- Lưới phím bấm -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Hàng 1 -->
            <button onclick="clearAll()" class="btn-act btn-shadow col-span-2 bg-red-500/20 text-red-400 hover:bg-red-500/30 font-bold text-lg py-3.5 rounded-2xl border border-red-500/30">
                AC
            </button>
            <button onclick="deleteDigit()" class="btn-act btn-shadow bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 font-bold text-lg py-3.5 rounded-2xl border border-amber-500/30">
                ⌫
            </button>
            <button onclick="chooseOperator('÷')" class="btn-act btn-shadow bg-indigo-600 text-white hover:bg-indigo-500 font-bold text-xl py-3.5 rounded-2xl">
                ÷
            </button>

            <!-- Hàng 2 -->
            <button onclick="appendNumber('7')" class="btn-act btn-shadow bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                7
            </button>
            <button onclick="appendNumber('8')" class="btn-act btn-shadow bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                8
            </button>
            <button onclick="appendNumber('9')" class="btn-act btn-shadow bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                9
            </button>
            <button onclick="chooseOperator('×')" class="btn-act btn-shadow bg-indigo-600 text-white hover:bg-indigo-500 font-bold text-xl py-3.5 rounded-2xl">
                ×
            </button>

            <!-- Hàng 3 -->
            <button onclick="appendNumber('4')" class="btn-act btn-shadow bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                4
            </button>
            <button onclick="appendNumber('5')" class="btn-act btn-shadow bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                5
            </button>
            <button onclick="appendNumber('6')" class="btn-act btn-shadow bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                6
            </button>
            <button onclick="chooseOperator('-')" class="btn-act btn-shadow bg-indigo-600 text-white hover:bg-indigo-500 font-bold text-xl py-3.5 rounded-2xl">
                -
            </button>

            <!-- Hàng 4 -->
            <button onclick="appendNumber('1')" class="btn-act btn-shadow bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                1
            </button>
            <button onclick="appendNumber('2')" class="btn-act btn-shadow bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                2
            </button>
            <button onclick="appendNumber('3')" class="btn-act btn-shadow bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                3
            </button>
            <button onclick="chooseOperator('+')" class="btn-act btn-shadow bg-indigo-600 text-white hover:bg-indigo-500 font-bold text-xl py-3.5 rounded-2xl">
                +
            </button>

            <!-- Hàng 5 -->
            <button onclick="appendNumber('0')" class="btn-act btn-shadow col-span-2 bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                0
            </button>
            <button onclick="appendDot()" class="btn-act btn-shadow bg-slate-800 text-slate-100 hover:bg-slate-700 font-semibold text-xl py-3.5 rounded-2xl border border-slate-700/50">
                .
            </button>
            <button onclick="compute()" class="btn-act btn-shadow bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-2xl py-3.5 rounded-2xl">
                =
            </button>
        </div>
    </div>

    <script>
        // Các biến trạng thái của máy tính
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;
        let shouldResetScreen = false;

        // Lấy các phần tử DOM hiển thị
        const currentDisplay = document.getElementById('currentDisplay');
        const historyDisplay = document.getElementById('historyDisplay');

        // Cập nhật giao diện màn hình
        function updateDisplay() {
            currentDisplay.innerText = currentOperand;
            if (operation != null) {
                historyDisplay.innerText = `${previousOperand} ${operation}`;
            } else {
                historyDisplay.innerText = '';
            }
        }

        // Thêm chữ số
        function appendNumber(number) {
            if (currentOperand === '0' || shouldResetScreen) {
                currentOperand = number;
                shouldResetScreen = false;
            } else {
                // Giới hạn độ dài để không tràn màn hình
                if (currentOperand.length < 12) {
                    currentOperand += number;
                }
            }
            updateDisplay();
        }

        // Thêm dấu chấm thập phân
        function appendDot() {
            if (shouldResetScreen) {
                currentOperand = '0.';
                shouldResetScreen = false;
                updateDisplay();
                return;
            }
            if (!currentOperand.includes('.')) {
                currentOperand += '.';
            }
            updateDisplay();
        }

        // Chọn phép tính (+ - * /)
        function chooseOperator(op) {
            if (currentOperand === '' && previousOperand === '') return;
            
            if (previousOperand !== '') {
                compute();
            }

            operation = op;
            previousOperand = currentOperand;
            shouldResetScreen = true;
            updateDisplay();
        }

        // Thực hiện tính toán kết quả
        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                    computation = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        alert('Không thể chia cho 0!');
                        clearAll();
                        return;
                    }
                    computation = prev / current;
                    break;
                default:
                    return;
            }

            // Làm tròn số thập phân để tránh lỗi số thực dài như 0.1 + 0.2
            computation = Math.round(computation * 100000000) / 100000000;

            historyDisplay.innerText = `${previousOperand} ${operation} ${currentOperand} =`;
            currentOperand = computation.toString();
            operation = undefined;
            previousOperand = '';
            shouldResetScreen = true;
            currentDisplay.innerText = currentOperand;
        }

        // Xóa toàn bộ (AC)
        function clearAll() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            shouldResetScreen = false;
            updateDisplay();
        }

        // Xóa một chữ số (Backspace)
        function deleteDigit() {
            if (shouldResetScreen) return;
            if (currentOperand.length === 1 || (currentOperand.length === 2 && currentOperand.startsWith('-'))) {
                currentOperand = '0';
            } else {
                currentOperand = currentOperand.slice(0, -1);
            }
            updateDisplay();
        }

        // Thêm hỗ trợ bấm từ bàn phím máy tính
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendDot();
            if (e.key === '=' || e.key === 'Enter') {
                e.preventDefault();
                compute();
            }
            if (e.key === 'Backspace') deleteDigit();
            if (e.key === 'Escape') clearAll();
            if (e.key === '+') chooseOperator('+');
            if (e.key === '-') chooseOperator('-');
            if (e.key === '*') chooseOperator('×');
            if (e.key === '/') {
                e.preventDefault();
                chooseOperator('÷');
            }
        });
    </script>
</body>
</html>
