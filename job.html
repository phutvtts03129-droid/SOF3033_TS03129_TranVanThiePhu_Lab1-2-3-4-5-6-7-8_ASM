
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý công việc</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex: 1;
            min-width: 150px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .add {
            background: #2563eb;
        }

        .edit {
            background: #f59e0b;
            margin-right: 5px;
        }

        .delete {
            background: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        tr:hover {
            background: #e0edff;
        }

        .task-img {
            width: 55px;
            height: 45px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📋 QUẢN LÝ CÔNG VIỆC</h1>
        <h3>Thêm công việc mới</h3>
        <div class="form">
            <input type="text" id="macv"
                   placeholder="Mã công việc">
            <input type="text" id="tencv"
                   placeholder="Tên công việc">
            <input type="text" id="who"
                   placeholder="Người thực hiện">
            <button class="add" onclick="addJob()">
                Thêm công việc
            </button>
        </div>
        <div id="container"></div>
    </div>
    <script src="jop.js"></script>

</body>
</html>
