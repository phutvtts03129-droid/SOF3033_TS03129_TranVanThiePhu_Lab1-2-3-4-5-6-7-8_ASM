
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sinh viên</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .box {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 5px;
            color: #1e3a8a;
        }

        h3 {
            margin-top: 5px;
            margin-bottom: 20px;
            color: #555;
        }

     table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    margin-top: 20px;
}

th {
    background: #2563eb;
    color: white;
    padding: 14px 10px;
    border: 1px solid #ddd;
}

td {
    padding: 14px 10px;
    text-align: center;
    border: 1px solid #ddd;
}

tr:nth-child(even) {
    background: #f1f5ff;
}

tr:hover {
    background: #dbeafe;
}

.diem {
    font-weight: bold;
    color: #16a34a;
}
    </style>
</head>
<body>
    <div class="box">
        <h1>📚 DANH SÁCH SINH VIÊN</h1>
        <div id="container"></div>
    </div>
    <script src="Objec.js"></script>
</body>
</html>
